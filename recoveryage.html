<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Recovery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #555;
            text-align: center;
        }

        form {
            background-color: #fff;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #555;
            box-shadow: 0 15px 25px rgba(255, 255, 255, 0.5);
            width: 85%; /* Adjusted width */
            max-width: 350px; /* Adjusted max-width */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        form:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 5px;
            font-weight: bold;
            text-align: left;
        }

        input[type="email"] {
            width: 100%;
            padding: 7px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            margin-bottom:15px;
        }

        input[type="email"]:hover {
            border-color: #555;
            box-shadow: 0 0 8px rgba(85, 85, 85, 0.2);
        }

        input[type="email"]:focus {
            border-color: #555;
            box-shadow: 0 0 8px rgba(85, 85, 85, 0.3);
            outline: none;
        }

        input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #555;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        input[type="submit"]:hover {
            background-color: #333;
            transform: translateY(-2px);
        }

        input[type="submit"]:active {
            transform: translateY(0);
        }

        p {
            font-size: 12px;
            color: #555;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body style="background: url('https://www.shutterstock.com/image-photo/clothes-on-rack-store-600nw-1692115165.jpg') no-repeat center center fixed; background-size: cover;"  >
   
    <form>
          <h2>Find your account</h2>
   <br>
        <label>Enter your email or Phone.<a href="abcd">Can't reset password.?</a></label>
        <input type="email" placeholder="Email or phone" required>
            <p>We will send a password recovery link to your email address.</p>
         <br>
        <input type="submit" value="Continue">
        <p><a href="abcd.html">Forgot email?</a></p>
         
    </form>
   
</body>
</html>
