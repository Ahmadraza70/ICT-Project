<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loginpage</title>
    <style>
        /* General body styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        /* Style the title */
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #555;
            text-align: center;
            font-weight: bold;
        }

        /* Center the form and add some padding */
        .form-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #000;
            box-shadow: 0 15px 25px rgba(255, 255, 255, 0.5);
            width: 85%; /* Adjusted width */
            max-width: 350px; /* Adjusted max-width */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .form-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        /* Style the labels */
        label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 5px;
            font-weight: bold;
            text-align: left;
        }

        /* Style the input fields */
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            margin-bottom: 15px;
        }

        /* Hover effect for input fields */
        input[type="text"]:hover,
        input[type="password"]:hover {
            border-color: #555;
            box-shadow: 0 0 8px rgba(85, 85, 85, 0.2);
        }

        /* Focus effect for input fields */
        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #555;
            box-shadow: 0 0 8px rgba(85, 85, 85, 0.3);
            outline: none;
        }

        /* Style the submit button */
        button[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #555;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        button[type="submit"]:hover {
            background-color: #333;
            transform: translateY(-2px);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        /* Style the "Forgot Password?" link */
        a {
            font-size: 12px;
            color: blue;
            text-decoration: none;
            display: block;
            text-align: center;
            margin-top: 10px;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Additional styling for the "Create account" link */
        p {
            font-size: 12px;
            text-align: center;
            margin-top: 15px;
        }

        p a {
            color: blue;
            text-decoration: none;
        }

        p a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body style="background: url('https://www.shutterstock.com/image-photo/clothes-on-rack-store-600nw-1692115165.jpg') no-repeat center center fixed; background-size: cover;">
    

    <!-- Form container -->
    <div class="form-container">
        <form action="homepage2.html">

                   <h1>Log In</h1>
            <div>
                <label for="name">Username</label>
                <input id="name" type="text" placeholder="Name or Mobile" required>
            </div>
            <div>
                <label for="password">Password</label>
                <input id="password" type="password" placeholder="Enter password" required>
            </div>
            <div>
                <button type="submit">LOGIN</button>
            </div>
       
            <a href="recoveryage.html">Forgot Password?</a>
        <br>
              
            <p>Do not have an account.?<a href="registration.html">Create one.</a></p>
             
            </form>
    </div>
</body>
</html>
